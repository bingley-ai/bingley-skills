<style id="bingley-interactions">
:root{ --ink-soft:#454c57; --ink-faint:#8a9099; --amber:var(--yellow); }
/* affordances */
.meetings .meeting-row{cursor:pointer;border-radius:10px;transition:background .15s}

.plan .task{cursor:pointer;border-radius:8px;transition:background .15s}
.plan .task:hover{background:rgba(30,42,55,.03)}
.plan .task.done span:not(.action):not(.bullet):not(.ring){color:var(--ink-faint);text-decoration:line-through}
.plan .more{cursor:pointer;user-select:none}
.commitments .promise-row{cursor:pointer;transition:background .15s}
.commitments .promise-row:hover{background:rgba(30,42,55,.03)}
.commitments .promise-row.done{color:var(--ink-faint)}
.commitments .promise-row.done span:nth-child(2){text-decoration:line-through}
.pipeline .stage-labels>div{cursor:pointer;border-radius:8px;transition:background .15s;padding:4px 6px;margin:-4px -6px}
.pipeline .stage-labels>div:hover{background:rgba(30,42,55,.04)}
.pipeline .stages i{cursor:pointer}
.bk-stage-hint{margin-top:12px;font-size:11.5px;color:var(--ink-faint);user-select:none}
/* rich brief sub-elements */
.prep-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.prep-h{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
.prep-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.prep-list li{position:relative;padding-left:13px;font-size:12.5px;color:var(--ink-soft);line-height:1.42}
.prep-list li::before{content:"";position:absolute;left:0;top:6px;width:4px;height:4px;border-radius:50%;background:var(--ink-faint)}
.prep-mail{font-size:12.5px;color:var(--ink-soft);line-height:1.5}

.prep-foot{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-faint)}
/* drill rows */
.sd-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.sd-row:first-of-type{border-top:none}
.sd-name{flex:1;color:var(--ink);font-weight:500;min-width:0}
.sd-name .co{color:var(--ink-faint);font-weight:400}
.sd-meta{color:var(--ink-faint);font-size:11px;flex:0 0 auto;text-align:right}
.sd-val{width:54px;flex:0 0 auto;text-align:right;color:var(--ink);font-weight:600}
.sd-more{font-size:11px;color:var(--ink-faint);padding:9px 0 0}
.sd-insight{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px 12px;background:rgba(237,169,21,.12);border-radius:10px;font-size:12.5px;color:var(--ink-soft);line-height:1.4}
.sd-insight svg{width:15px;height:15px;color:var(--amber);flex:0 0 auto}
.sd-insight b{color:var(--ink)}
/* centre-focus modal */
.focus{position:fixed;inset:0;z-index:600;display:none}
.focus.show{display:block}
.focus-scrim{position:absolute;inset:0;background:rgba(26,36,48,.14);opacity:0;transition:opacity .22s ease}
.focus.in .focus-scrim{opacity:1}
.focus-card{position:absolute;left:0;top:0;width:min(520px,92vw);max-height:86vh;overflow:auto;background:linear-gradient(180deg,#FFFFFF 0%,#F7F5F1 100%);border-radius:20px;padding:22px 24px 24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 1px rgba(30,42,55,.05), 0 22px 50px -14px rgba(30,42,55,.40), 0 3px 10px rgba(30,42,55,.14);transform:scale(.62);opacity:0;transform-origin:50% 50%;transition:transform .26s cubic-bezier(.2,.9,.25,1.06), opacity .18s ease;will-change:transform}
.focus.in .focus-card{transform:scale(1);opacity:1}
.focus-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border:none;border-radius:50%;background:rgba(30,42,55,.06);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;z-index:2}
.focus-x svg{width:15px;height:15px}
.focus-x:hover{background:rgba(30,42,55,.12);color:var(--ink)}

.focus-h{font-size:21px;font-weight:680;letter-spacing:-.015em;color:var(--ink);line-height:1.15;margin-bottom:16px;padding-right:30px}
@media (prefers-reduced-motion:reduce){ .focus-card{transition:opacity .12s ease;transform:none!important} }

<script>
/* Rate-this-skill strip (was HEAD OFFICE). Lives in the SHELL so every Bingley room gets it
   from one place; a room only sets data-skill on #officeStrip. The pips are REAL LINKS, not
   fetch(): Cowork artefacts sandbox outbound requests, so a link opening the browser is the
   only channel out. Asked every run until answered, then the strip is hidden for good.
   Fails OPEN: if localStorage is unavailable we keep asking rather than go silent. */
(function(){
  var strip=document.getElementById('officeStrip');
  if(!strip) return;
  var skill=strip.getAttribute('data-skill')||'';
  var KEY='bingley.rated.'+skill;
  function rated(){ try{ return !!window.localStorage.getItem(KEY); }catch(e){ return false; } }
  if(!skill || rated()){ strip.style.display='none'; return; }
  var lbl=strip.querySelector('.office-lbl');
  if(lbl) lbl.textContent='Rate this '+(strip.getAttribute('data-label')||'panel');
  var wrap=document.getElementById('officePips'), html='';
  for(var i=1;i<=10;i++){
    html+='<a class="office-pip" href="https://bingley.ai/r?s='+skill+'&n='+i+'"'+
          ' target="_blank" rel="noopener noreferrer" data-n="'+i+'">'+i+'</a>';
  }
  wrap.innerHTML=html;
  var pips=[].slice.call(wrap.children);
  wrap.addEventListener('mouseover',function(e){var b=e.target.closest('.office-pip');if(!b)return;
    var n=+b.dataset.n; pips.forEach(function(p){p.classList.toggle('lit',+p.dataset.n<=n);});});
  wrap.addEventListener('mouseleave',function(){pips.forEach(function(p){p.classList.remove('lit');});});
  wrap.addEventListener('click',function(e){var b=e.target.closest('.office-pip');if(!b)return;
    var n=+b.dataset.n;
    try{ window.localStorage.setItem(KEY,String(n)); }catch(err){}
    pips.forEach(function(p){p.classList.remove('lit');p.classList.toggle('chosen',+p.dataset.n<=n);});
    setTimeout(function(){ strip.classList.add('rated'); },260);});
})();

(function(){
  const stage=document.getElementById('stage');
  function fit(){
    const scale=Math.min(window.innerWidth/1448,window.innerHeight/1086);
    stage.style.setProperty('--fit',String(scale));
  }
  fit();
  addEventListener('resize',fit,{passive:true});
})();
</script>
