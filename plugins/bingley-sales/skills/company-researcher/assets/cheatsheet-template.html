#pbwrap /* fit card */
.fit{flex:none;display:flex;gap:13px;align-items:center;background:#fff;border:1px solid var(--line);
      border-radius:13px;box-shadow:0 3px 12px rgba(75,55,42,.05);padding:12px 16px;width:210px;}
#pbwrap /* badge: coloured outline + coloured letter,#pbwrap NOT white-on-fill. Backgrounds get dropped by some
   PDF exporters (print-color-adjust isn't always honoured); a border + dark letter always prints,#pbwrap so the badge stays legible whether or not the fill renders. */
.grade{width:44px;height:44px;border-radius:11px;background:#eef7f1;border:2px solid var(--go);color:var(--go-700);display:flex;
        align-items:center;justify-content:center;font-weight:800;font-size:22px;flex:none;}
#pbwrap .fit.v-ask .grade{background:var(--amber-soft);border-color:var(--ask);color:var(--amber-700);}
#pbwrap .fit.v-nogo .grade{background:#f1f2f4;border-color:var(--mut2);color:var(--sec);}
#pbwrap .fitline{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--go-700);}
#pbwrap .fit.v-ask .fitline{color:#9a6a09;}
#pbwrap .fit.v-nogo .fitline{color:var(--mut);}
#pbwrap .fitscore{font-size:26px;font-weight:560;letter-spacing:-.02em;line-height:1.05;margin:2px 0;color:var(--ink);}
#pbwrap .fitscore span{font-size:12px;font-weight:600;color:var(--mut2);}
#pbwrap .reachline{font-size:9.5px;color:var(--mut);line-height:1.45;}
#pbwrap .reachline+.reachline{color:var(--mut2);}
#pbwrap /* ---------- vitals strip ---------- */
.vit{display:flex;border:1px solid var(--line);border-radius:13px;margin:14px 0 0;overflow:hidden;}
#pbwrap .v{flex:1;padding:11px 15px;border-right:1px solid var(--line2);}
#pbwrap .v:last-child{border-right:0;}
#pbwrap .vk{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut2);font-weight:700;}
#pbwrap .vv{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin-top:4px;color:var(--ink);}
#pbwrap .vv .sub{color:var(--mut);font-weight:500;font-size:10.5px;}
#pbwrap /* ---------- body ---------- */
.body{display:flex;flex:1 1 auto;min-height:0;overflow:hidden;margin-top:14px;}
#pbwrap .col{display:flex;flex-direction:column;min-height:0;overflow:hidden;}
#pbwrap .col.l{flex:0 0 52%;max-width:52%;padding-right:8px;}
#pbwrap .col.r{flex:0 0 48%;max-width:48%;padding-left:8px;}
#pbwrap /* cards shrink and clip their OWN content,#pbwrap so a card BORDER is never sliced by the column edge */
.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;
       box-shadow:0 3px 12px rgba(75,55,42,.045);padding:12px 15px;
       flex:0 1 auto;min-height:0;overflow:hidden;margin-bottom:8px;}
#pbwrap .card:last-child{margin-bottom:0;}
#pbwrap /* pin the FIXED-content cards out of the shrink pool: the wordy lists absorb any overflow,#pbwrap so a BANT row (e.g. "Timing") or a tech chip is never the thing that gets cut */
.col .cBant{flex:0 0 auto;}
#pbwrap .col .cTech{flex:0 0 auto;}
#pbwrap /* verdict banner (cheat-sheet only; omitted when no verdict) */
.vbanner{margin-top:13px;border:1px solid var(--line);border-radius:13px;padding:11px 15px;background:#fbfdfc;font-size:12.5px;line-height:1.45;color:var(--sec);}
#pbwrap .vbanner b{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--navy);font-weight:800;display:block;margin-bottom:4px;}
#pbwrap /* section header: small per-section square + uppercase label + hairline rule.
   One colour per section; titles stay navy except the two emphasis sections. */
h3{display:flex;align-items:center;gap:8px;margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid var(--line2);
   font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--navy);}
#pbwrap h3 .i{width:9px;height:9px;border-radius:2px;flex:none;background:var(--slate);}
#pbwrap h3 .rt{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:600;font-size:9.5px;color:var(--mut2);}
#pbwrap .cWhy h3 .i,#pbwrap .cComp h3 .i,#pbwrap .cBant h3 .i{background:var(--accent);}
#pbwrap .cL30 h3{color:var(--violet);}
#pbwrap .cL30 h3 .i{background:var(--violet);}
#pbwrap /* ONE bullet style,#pbwrap used by every list */
ul.cl{margin:0;padding:0;list-style:none;}
#pbwrap ul.cl li{position:relative;padding-left:14px;margin-bottom:7px;font-size:12px;line-height:1.45;color:var(--sec);}
#pbwrap ul.cl li:last-child{margin-bottom:0;}
#pbwrap ul.cl li:before{content:"";position:absolute;left:1px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--bullet);}
#pbwrap ul.cl li .d{color:var(--mut2);font-size:10px;}
#pbwrap ul.cl li b{color:var(--ink);font-weight:700;}
#pbwrap ul.cl li .note{color:var(--mut);}
#pbwrap /* angle: the single highlighted element */
.angle{margin-top:10px;padding:9px 12px;border:1px solid #dbe3f0;border-radius:9px;background:var(--accent-soft);}
#pbwrap .angle b{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:3px;}
#pbwrap .angle .x{font-size:12px;line-height:1.45;color:var(--accent-txt);font-weight:500;}
#pbwrap /* chips (neutral,#pbwrap uniform) */
.chips{display:flex;flex-wrap:wrap;gap:6px;}
#pbwrap .chip2{font-size:11px;color:var(--navy);background:#f4f3ee;border:1px solid var(--line);border-radius:7px;padding:4px 10px;}
#pbwrap /* BANT (single accent) */
.bant{margin-top:1px;}
#pbwrap .br{display:flex;align-items:center;gap:10px;margin-top:7px;}
#pbwrap .br:first-child{margin-top:0;}
#pbwrap .bk{font-size:10.5px;width:64px;color:var(--sec);font-weight:600;}
#pbwrap .bbar{flex:1;height:6px;border-radius:999px;background:var(--line2);overflow:hidden;}
#pbwrap .bbar i{display:block;height:100%;border-radius:999px;background:var(--accent);}
#pbwrap .bv{font-size:10px;color:var(--mut);width:28px;text-align:right;font-weight:600;}
#pbwrap .tierp{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;
   border-radius:999px;color:var(--accent-txt);background:var(--accent-soft);}
#pbwrap /* last 30 days: violet section (one colour). Soft violet callout + violet type labels. */
.l30callout{background:var(--violet-soft);border:1px solid var(--violet-line);border-radius:9px;
   padding:9px 11px;margin-bottom:8px;font-size:12px;font-weight:700;color:var(--violet-txt);line-height:1.35;}
#pbwrap .sig{margin:0;padding:0;list-style:none;}
#pbwrap .sig li{position:relative;padding-left:14px;margin-bottom:7px;font-size:11.5px;line-height:1.45;color:var(--sec);}
#pbwrap .sig li:last-child{margin-bottom:0;}
#pbwrap .sig li:before{content:"";position:absolute;left:1px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--violet);}
#pbwrap .sig .ty{font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:9px;color:var(--violet);margin-right:6px;}
#pbwrap .sig .src{color:var(--mut2);font-size:9.5px;}
#pbwrap /* walk-in band (kept at bottom): amber section. Soft amber tint,#pbwrap amber header + bullets. */
.band{position:static;flex:0 0 auto;max-height:46mm;overflow:hidden;margin:12px 0 0;border:1px solid var(--amber-line);border-radius:13px;box-shadow:0 3px 12px rgba(75,55,42,.045);padding:13px 16px;background:var(--amber-soft);}
#pbwrap .band h3{color:var(--amber-700);border-bottom-color:#efe2c8;}
#pbwrap .band h3 .i{background:var(--amber);}
#pbwrap .hookrow{display:flex;margin-top:5px;}
#pbwrap .hookcell{flex:1;position:relative;padding:2px 16px 2px 28px;font-size:12px;line-height:1.45;color:var(--sec);border-right:1px solid #efe2c8;
   display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;max-height:7.7em;}
#pbwrap .hookcell:last-child{border-right:0;padding-right:0;}
#pbwrap .hookcell:before{content:"";position:absolute;left:13px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--amber);}
#pbwrap /* footer — last flex child,#pbwrap natural flow,#pbwrap always fully visible below the band */
.ft{position:static;flex:0 0 auto;max-height:20mm;overflow:hidden;margin-top:10px;padding-top:11px;border-top:1px solid var(--line);background:#fff;display:flex;
     justify-content:space-between;align-items:flex-start;gap:16px;}
#pbwrap .ft .srcs{font-size:9px;color:var(--mut2);line-height:1.6;max-width:140mm;}
#pbwrap .ft .srcs b{color:var(--mut);text-transform:uppercase;letter-spacing:.1em;font-size:8.5px;font-weight:800;}
#pbwrap .ft .stamp{font-size:9px;color:var(--mut2);white-space:nowrap;text-align:right;}
#pbwrap /* ---------- PRINT-SAFE line budgets ----------
   -webkit-line-clamp is SILENTLY DROPPED by Chrome's Save-PDF,#pbwrap so clamps alone hold on screen
   and fail in the actual PDF. max-height + overflow:hidden IS honoured in print,#pbwrap so each field
   is hard-capped to its line count in em at its own font-size (line-height ~1.45). Values
   measured live in Chrome at each field's real column width — do not loosen without re-measuring. */
.summ{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:3.0em;}
#pbwrap .angle .x{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:3.0em;}
#pbwrap ul.cl li{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:3.0em;}
#pbwrap .sig li{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:3.0em;}
#pbwrap .l30callout{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:4.7em;}

#pbScan{display:block;font-family:"Inter Display","Segoe UI",Helvetica,Arial,sans-serif;color:#17191d;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pbScan .inner{padding:0}
#pbScan .sb-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #17191d;padding-bottom:9px;margin-bottom:13px}
#pbScan .sb-t{font-size:18px;font-weight:800;letter-spacing:-.01em}
#pbScan .sb-c{font-size:11px;color:#5b6671;white-space:nowrap}
#pbScan .sb-c b{color:#17191d;font-weight:800}
#pbScan .sb-row{display:grid;grid-template-columns:24px 1fr 76px 40px 66px;gap:11px;align-items:center;padding:8px 2px;border-bottom:1px solid #e6e1db;page-break-inside:avoid}
#pbScan .sb-rank{font-size:11px;font-weight:700;color:#9099a2;text-align:right}
#pbScan .sb-nm{font-size:12.5px;font-weight:700;line-height:1.2}
#pbScan .sb-dom{font-size:10px;font-weight:400;color:#9099a2}
#pbScan .sb-why{font-size:10.5px;color:#5b6671;line-height:1.3;margin-top:2px}
#pbScan .sb-buyer{font-size:9.5px;font-weight:700;text-align:center}
#pbScan .sb-score{font-size:14px;font-weight:800;text-align:center}
#pbScan .sb-vd{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;text-align:center;border:1.4px solid currentColor;border-radius:999px;padding:3px 2px}
#pbScan .go{color:#147a44}#pbScan .maybe{color:#9a6a00}#pbScan .skip{color:#a23a30}
#pbScan .sb-buyer.no{color:#aab0b8}
#pbScan .sb-ft{display:flex;justify-content:space-between;margin-top:16px;padding-top:9px;border-top:1px solid #e6e1db;font-size:9.5px;color:#717a85}
#pbScan .sb-ft b{color:#17191d}


@media screen{ #pbwrap{display:none} }
@page{ size:A4 portrait; margin:13mm 13mm 11mm }
@media print{
  html,body{ width:auto!important;height:auto!important;overflow:visible!important;background:#fff!important }
  .stage,.shell,.topbar,.side,.footer-avatar,.office,.updated,.cr-tabs,.cr-pdf,#asWrap,#asBack,.as-pdf{ display:none!important }
  #pbwrap{ display:block!important }
  /* per-account one-pager (Save PDF) */
  #pbwrap.solo #pbScan{ display:none!important }
  #pbwrap.solo .brief{ display:none!important }
  #pbwrap.solo .brief.pbactive{ display:block!important; page-break-after:auto!important }
  /* all-accounts overview (Save all PDF) = the ranked scan list, one clean doc */
  #pbwrap.scanmode .brief{ display:none!important }
  #pbwrap.scanmode #pbScan{ display:block!important }
  /* default fallback: every brief, each its own page */
  #pbwrap:not(.solo):not(.scanmode) #pbScan{ display:none!important }
  #pbwrap:not(.solo):not(.scanmode) .brief{ page-break-after:always }
  #pbwrap:not(.solo):not(.scanmode) .brief:last-child{ page-break-after:auto }
}

<script>
/* Rate-this-skill strip (was HEAD OFFICE). Lives in the SHELL so every Bingley room gets it
   from one place; a room only sets data-skill on #officeStrip. The pips are REAL LINKS, not
   fetch(): Cowork artefacts sandbox outbound requests, so a link opening the browser is the
   only channel out. Asked every run until answered, then the strip is hidden for good.
   Fails OPEN: if localStorage is unavailable we keep asking rather than go silent. */
(function(){
  var strip=document.getElementById('officeStrip');
  if(!strip) return;
  var skill=strip.getAttribute('data-skill')||'';
  var KEY='bingley.rated.'+skill;
  function rated(){ try{ return !!window.localStorage.getItem(KEY); }catch(e){ return false; } }
  if(!skill || rated()){ strip.style.display='none'; return; }
  var lbl=strip.querySelector('.office-lbl');
  if(lbl) lbl.textContent='Rate this '+(strip.getAttribute('data-label')||'panel');
  var wrap=document.getElementById('officePips'), html='';
  for(var i=1;i<=10;i++){
    html+='<a class="office-pip" href="https://bingley.ai/r?s='+skill+'&n='+i+'"'+
          ' target="_blank" rel="noopener noreferrer" data-n="'+i+'">'+i+'</a>';
  }
  wrap.innerHTML=html;
  var pips=[].slice.call(wrap.children);
  wrap.addEventListener('mouseover',function(e){var b=e.target.closest('.office-pip');if(!b)return;
    var n=+b.dataset.n; pips.forEach(function(p){p.classList.toggle('lit',+p.dataset.n<=n);});});
  wrap.addEventListener('mouseleave',function(){pips.forEach(function(p){p.classList.remove('lit');});});
  wrap.addEventListener('click',function(e){var b=e.target.closest('.office-pip');if(!b)return;
    var n=+b.dataset.n;
    try{ window.localStorage.setItem(KEY,String(n)); }catch(err){}
    pips.forEach(function(p){p.classList.remove('lit');p.classList.toggle('chosen',+p.dataset.n<=n);});
    setTimeout(function(){ strip.classList.add('rated'); },260);});
})();

  }

})();
</script>

 function isNone(c){return String(((c||{}).scan||{}).verdict||'').toUpperCase()==='NONE';}
 var unranked=co.length>0&&co.every(isNone);
 function ini(n){var p=String(n||'').replace(/[^A-Za-z &]/g,'').split(/\s+/).filter(Boolean);return ((p[0]||'')[0]||'')+((p[1]||'')[0]||'');}
 function hue(n){n=String(n||'');var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return 'hsl('+h+',38%,45%)';}
 var go=0,mb=0,sk=0;co.forEach(function(c){var v=String((c.scan||{}).verdict||'').toUpperCase();if(v==='GO')go++;else if(v==='MAYBE')mb++;else sk++;});
 // DEFENSIVE: never trust the incoming array order (merge()/hand-built DATA) — always
 // re-sort a copy of the indices by band (Strong/Fair/Longshot) then score desc before
 // rendering, so a misordered DATA object can never render out of order on screen.
 // Original indices are kept (not the sorted rank) for onclick="openAccount(i)" since
 // crTabs/co-panels are still built from D.companies in its original, unsorted order.
 function bandRank(v){v=String(v||'').toUpperCase();return v==='GO'?0:v==='MAYBE'?1:v==='SKIP'?2:3;}
 function scoreKey(s){var n=Number(s);return -(isFinite(n)?n:-1);}
 var idx=co.map(function(c,i){return i;});
 idx.sort(function(a,b){
  var sa=co[a].scan||{},sb=co[b].scan||{};
  var ra=bandRank(sa.verdict),rb=bandRank(sb.verdict);
  if(ra!==rb)return ra-rb;
  var ka=scoreKey(sa.score),kb=scoreKey(sb.score);
  if(ka!==kb)return ka-kb;
  return a-b; // stable tie-break on original position
 });
 var rows=idx.map(function(origI,rank){var c=co[origI];var s=c.scan||{};
  var rhead='<div class="as-rank">'+(rank+1)+'</div>'
   +'<div class="as-mono" style="background:'+hue(c.name||'')+'">'+esc(ini(c.name||''))+'</div>'
   +'<div><div class="as-name">'+esc(c.name||'')+'</div><div class="as-why">'+esc(s.why||c.summary||'')+'</div></div>';
  if(isNone(c)){ // unscored: name + what they do + chevron. No invented fit.
   return '<button class="as-row none" onclick="openAccount('+origI+')">'+rhead+'<div class="as-chev">›</div></button>';
  }
  return '<button class="as-row '+vc(s.verdict)+'" onclick="openAccount('+origI+')">'+rhead
   +'<div class="as-buyer '+(s.buyer?'ok':'no')+'"><span class="ic">'+(s.buyer?'✓':'–')+'</span>'+(s.buyer?'Buyer reachable':'No clear buyer')+'</div>'
   +'<div class="as-fit"><span class="as-bar"><span style="width:'+(parseInt(s.score,10)||0)+'%;background:'+bar(s.verdict)+'"></span></span><span class="as-score">'+(parseInt(s.score,10)||0)+'</span></div>'
   +'<div class="as-verdict '+vc(s.verdict)+'">'+vlab(s.verdict)+'</div>'
   +'<div class="as-chev">›</div></button>';
 }).join('');
 var counts='<div class="as-pill as-go"><span class="dot"></span>'+go+' Strong</div>'
   +'<div class="as-pill as-maybe"><span class="dot"></span>'+mb+' Fair</div>'
   +'<div class="as-pill as-skip"><span class="dot"></span>'+sk+' Longshot</div>';
 var noun=co.length===1?'company':'companies';
 var head=unranked
  ? '<div class="as-head"><div class="as-title">Company Research · '+co.length+' '+noun+'</div>'
    +'<div class="as-actions"><div class="as-cta">Researched, not ranked. <b>Add what you sell</b> and every company gets a Strong / Fair / Longshot fit.</div></div></div>'
  : '<div class="as-head"><div class="as-title">Company Research · '+co.length+' '+noun+'</div>'
    +'<div class="as-actions">'+counts+'</div></div>';
 var cr=document.querySelector('.cr'); cr.classList.add('scan');
 var w=document.createElement('div');w.id='asWrap';w.innerHTML=head+'<div class="as-list'+(unranked?' unranked':'')+'">'+rows+'</div>';cr.appendChild(w);
 var allpdf=document.createElement('button');allpdf.id='asAllPdf';allpdf.className='cr-pdf';allpdf.style.zIndex='6';allpdf.style.maxWidth='none';allpdf.style.whiteSpace='nowrap';allpdf.setAttribute('title','Save all '+co.length+' as one PDF');allpdf.textContent='Save all PDF';allpdf.onclick=function(){if(window.crSaveAllPDF)window.crSaveAllPDF();};cr.appendChild(allpdf);
 var back=document.createElement('button');back.id='asBack';back.innerHTML='← All accounts';cr.appendChild(back);
 window.openAccount=function(i){w.style.display='none';allpdf.style.display='none';if(window.crSwitch)window.crSwitch(i);back.style.display='block';var pdf=document.getElementById('crPdf');if(pdf)pdf.style.display='';};
 window.backToScan=function(){w.style.display='';allpdf.style.display='';var ps=document.querySelectorAll('.co-panel');for(var k=0;k<ps.length;k++)ps[k].classList.remove('active');back.style.display='none';var t=document.getElementById('crTabs');if(t)t.style.display='none';var pdf=document.getElementById('crPdf');if(pdf)pdf.style.display='none';};
 back.onclick=window.backToScan;
 window.backToScan();
 /* N=1: a one-row list is a pointless click, so open the card straight away and hide the back
    button. Same template, same data, same code path — this is NOT a second view. */
 if(co.length===1){window.openAccount(0);back.style.display='none';}
})();}
})();

<div id="pbwrap"></div>
<script id="pb-js">
(function(){
  var PB; try{ PB=JSON.parse(document.getElementById('room-data').textContent); }catch(e){ PB={companies:[]}; }
  var cos=(PB&&PB.companies)||[];
  var PROFILE=(PB&&PB.company_profile)||null;   // print must respect the SAME profile gate as the screen
  window.crSavePDF=window.crSavePDF||function(){window.print();};
  window.crSaveAllPDF=window.crSaveAllPDF||function(){window.print();};
  if(!cos.length) return;
  function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function CAP(s,n){s=String(s==null?'':s).trim();return s.length>n?s.slice(0,n-1).replace(/\s+\S*$/,'')+'…':s;}
  function SC(s){return String(s==null?'':s).replace(/\s*\[[^\]]*\]\s*$/,'');}
  function A(x){return Array.isArray(x)?x:[];}
  function terse(v){v=String(v==null?'':v);v=v.replace(/\s*\[\s*(high|med|medium|low|inferred)\b[^\]]*\]?/ig,'').replace(/\s*\(\s*(high|med|medium|low|inferred)\s*\)\s*$/i,'').trim();var m=v.search(/[(—]/);if(m>0)return[v.slice(0,m).trim(),v.slice(m).replace(/^[(—\s]+/,'').replace(/\)\s*$/,'').trim()];return[v.trim(),''];}
  function sec(title,rt){return '<h3><span class="i"></span>'+title+(rt?'<span class="rt">'+rt+'</span>':'')+'</h3>';}
  function links(co){var L=co.links||{};var web=L.website||(co.domain?('https://'+co.domain):'');var o=[];
    if(web)o.push('<span class="pill">Website</span>');
    [['linkedin','LinkedIn'],['instagram','Instagram'],['x','X'],['maps','Maps']].forEach(function(k){if(L[k[0]])o.push('<span class="pill">'+k[1]+'</span>');});
    return o.length?'<div class="links">'+o.join('')+'</div>':'';}
  function vitals(co){var s=co.snapshot||{},g=co.growth||{},cells=[];
    var emp=terse(s.employees)[0];
    if(emp){var sub=g.label?(' <span class="sub">'+E(CAP(g.label,18))+'</span>'):'';cells.push(['Employees',E(CAP(emp,24))+sub]);}
    var rev=terse(s.revenue_estimate)[0]; if(rev)cells.push(['Revenue',E(CAP(rev,24))]);
    if(s.founded)cells.push(['Founded',E(CAP(s.founded,24))]);
    var st=terse(s.stage); if(st[0])cells.push(['Type',E(CAP(st[0],28))+(st[1]?' <span class="sub">'+E(CAP(st[1],16))+'</span>':'')]);
    if(s.hq)cells.push(['HQ',E(CAP(s.hq,22))]);
    A(co.highlights).some(function(h){if(!h)return false;var hv=(h.value==null||typeof h.value==='object')?'':h.value;var v=String(hv||''),l=String(h.label||'');
      if(v&&!cells.some(function(c){return c[1].indexOf(v)>=0;})&&['revenue','employees','founded'].indexOf(l.toLowerCase())<0){cells.push([(l||'Note').replace(/\b\w/,function(m){return m.toUpperCase();}),E(CAP(v,24))]);return true;}return false;});
    cells=cells.slice(0,6);
    return '<div class="vit">'+cells.map(function(c){return '<div class="v"><span class="vk">'+E(c[0])+'</span><span class="vv">'+c[1]+'</span></div>';}).join('')+'</div>';}
  function why(co){var trs=A(co.triggers).slice(0,2),ang=String(co.angle==null?'':co.angle).trim(),li='';if(ang==='-')ang='';
    trs.forEach(function(t){if(!t||!String(t.trigger||'').trim())return;var meta=[t.date&&t.date!=='-'?E(t.date):'',E(t.source)].filter(Boolean).join(' · ');
      li+='<li>'+E(CAP(t.trigger,94))+(meta?' <span class="d">'+meta+'</span>':'')+'</li>';});
    var ab=ang?'<div class="angle"><b>Angle to use</b><div class="x">'+E(CAP(ang,94))+'</div></div>':'';
    if(!li&&!ab)return '';
    return '<div class="card cWhy">'+sec('Why now')+(li?'<ul class="cl">'+li+'</ul>':'')+ab+'</div>';}
  function model(co){var d=A(co.dimensions).filter(function(x){return x&&A(x.points).length;})[0];if(!d)return '';
    var li=A(d.points).map(function(p){return CAP(SC(p),150);}).filter(function(p){return p&&p.trim();}).slice(0,3).map(function(p){return '<li>'+E(p)+'</li>';}).join('');
    return '<div class="card cModel">'+sec(E(CAP(d.title||'Business model',34)))+'<ul class="cl">'+li+'</ul></div>';}
  function tech(co){var t=A(co.tech_stack).filter(Boolean).slice(0,4).map(SC);if(!t.length)return '';
    return '<div class="card cTech">'+sec('Likely running')+'<div class="chips">'+t.map(function(x){return '<span class="chip2">'+E(CAP(x,38))+'</span>';}).join('')+'</div></div>';}
  function bant(co){var b=co.bant;if(!b||!PROFILE)return '';var rows=[['Budget','budget'],['Authority','authority'],['Need','need'],['Timing','timing']];
    var bars=rows.map(function(r){var v=Math.max(0,Math.min(5,parseInt(b[r[1]]||0,10)));return '<div class="br"><span class="bk">'+r[0]+'</span><span class="bbar"><i style="width:'+(v*20)+'%"></i></span><span class="bv">'+v+'/5</span></div>';}).join('');
    var lab=E(b.tier||'Fair');   /* authored tier from score_bant.py — never recompute (old sum>=14 diverged from scorer + screen); escaped like every other field */
    return '<div class="card cBant">'+sec('Fit signals (BANT)','<span class="tierp">'+lab+'</span>')+'<div class="bant">'+bars+'</div></div>';}
  function l30(co){var L=co.last30days;if(!L)return '';
    var sigs=A(L.signals).filter(function(s){return s&&s.text;}).slice(0,3);
    var li=sigs.map(function(s){var meta=[E(s.date),E(s.source)].filter(Boolean).join(' · ');
      return '<li>'+(s.type?'<span class="ty">'+E(s.type)+'</span>':'')+E(CAP(s.text,86))+(meta?' <span class="src">'+meta+'</span>':'')+'</li>';}).join('');
    var head=L.headline?'<div class="l30callout">'+E(CAP(L.headline,74))+'</div>':'';
    if(!head&&!li)return '';
    return '<div class="card cL30">'+sec('Last 30 days',L.updated?E(L.updated):'')+head+'<ul class="sig">'+li+'</ul></div>';}
  function comp(co){var c=A(co.competitors).filter(function(x){return x&&x.name;}).slice(0,3);if(!c.length)return '';
    var li=c.map(function(x){return '<li><b>'+E(CAP(x.name,40))+'</b>'+(x.note?' <span class="note">'+E(CAP(x.note,84))+'</span>':'')+'</li>';}).join('');
    return '<div class="card cComp">'+sec('Competitors')+'<ul class="cl">'+li+'</ul></div>';}
  function norm(co){
    if(!co.summary&&co.what_they_do)co.summary=co.what_they_do;
    if(!co.angle&&co.best_angle)co.angle=co.best_angle;
    // verdict NONE = unscored (no business profile). Do NOT synthesise a grade from it: an
    // unscored company would come out as a C / Longshot, a fabricated verdict on the printed page.
    if(co.scan&&!co.scoring&&String(co.scan.verdict||'').toUpperCase()!=='NONE'){var sc2=co.scan,V=String(sc2.verdict||'').toUpperCase();
      co.scoring={grade:({GO:'A',MAYBE:'B',SKIP:'C'}[V]||'C'),tier:({GO:'Strong',MAYBE:'Fair',SKIP:'Longshot'}[V]||'Longshot'),
        decision:({GO:'GO',MAYBE:'ASK',SKIP:'NO-GO'}[V]||'NO-GO'),score:sc2.score,reach:sc2.buyer?'High':'Low',buyer_found:!!sc2.buyer};}
    return co;}
  function hooks(co){var dec=(co.scoring&&co.scoring.decision)||'';
    var h=A(co.hooks).map(function(x){return (x&&typeof x!=='object')?CAP(String(x).trim().replace(/^\((.*)\)$/,'$1'),116):'';}).filter(function(x){return x;}).slice(0,3);
    if(!h.length)return '';
    var label=String(dec).toUpperCase()==='NO-GO'?'Things to weigh':'Walk in with';
    return '<div class="band">'+sec(label)+'<div class="hookrow">'+h.map(function(x){return '<div class="hookcell">'+E(x)+'</div>';}).join('')+'</div></div>';}
  function footer(co){var s=A(co.sources).filter(function(x){return x&&x.label;}).slice(0,4);
    return '<div class="ft"><div class="srcs"><b>Sources</b><br>'+s.map(function(x){return E(CAP(x.label,60));}).join(' &nbsp;·&nbsp; ')+'</div>'+
      '<div class="stamp">Company brief · '+E(PB.generated||'')+'<br>Free web research</div></div>';}
  function fitcard(co){var sb=co.scoring;if(!sb||!PROFILE)return '';var dec=sb.decision||'',dU=String(dec).toUpperCase(),cls=dU==='NO-GO'?'v-nogo':(dU==='ASK'||dU==='MAYBE')?'v-ask':'';
    var r1=sb.reach?'Reachable':'Hard to reach', r2=sb.buyer_found?'Buyer reachable':'No buyer yet';
    var sn=parseInt(sb.score,10);
    var fl=E(sb.tier||'');
    return '<div class="fit '+cls+'"><div class="grade">'+E(sb.grade||'?')+'</div><div>'+
      '<div class="fitline">'+fl+'</div>'+
      '<div class="fitscore">'+(isNaN(sn)?'—':E(sn)+'<span>/100</span>')+'</div>'+
      '<div class="reachline">'+r1+'</div><div class="reachline">'+r2+'</div></div></div>';}
  function brief(co){co=norm(co||{});var ini=((String(co.name||'?').split(/[^A-Za-z0-9]+/).filter(Boolean).slice(0,2).map(function(w){return w[0];}).join(''))||'?').toUpperCase();
    var hd='<div class="hd"><div class="hd-l"><div class="logo">'+E(ini)+'</div><div>'+
      '<div class="nm">'+E(CAP(co.name||'',60))+' <span class="dom">· '+E(CAP(co.domain||'',40))+'</span></div>'+
      '<div class="summ">'+E(CAP(co.summary||'',144))+'</div>'+links(co)+'</div></div>'+fitcard(co)+'</div>';
    var left=why(co)+model(co)+tech(co);
    var right=l30(co)+comp(co)+bant(co);
    var body='<div class="body"><div class="col l">'+left+'</div><div class="col r">'+right+'</div></div>';
    return '<div class="brief"><div class="inner"><div class="flow">'+hd+vitals(co)+body+'</div>'+hooks(co)+footer(co)+'</div></div>';}
  function svc(v){v=String(v==null?'':v).toUpperCase();return v==='GO'?'go':v==='MAYBE'?'maybe':'skip';}
  function bandRankPB(v){v=String(v||'').toUpperCase();return v==='GO'?0:v==='MAYBE'?1:v==='SKIP'?2:3;}
  function scoreKeyPB(s){var n=Number(s);return -(isFinite(n)?n:-1);}
  function scanBrief(list){list=(list||[]).filter(function(co){return co&&co.scan;});if(!list.length)return '';var rows='',go=0,mb=0,sk=0;
    // DEFENSIVE: sort a copy by band then score desc — never trust incoming array order.
    list=list.slice().map(function(co,i){return {co:co,i:i};}).sort(function(a,b){
      var sa=a.co.scan||{},sb=b.co.scan||{};
      var ra=bandRankPB(sa.verdict),rb=bandRankPB(sb.verdict);
      if(ra!==rb)return ra-rb;
      var ka=scoreKeyPB(sa.score),kb=scoreKeyPB(sb.score);
      if(ka!==kb)return ka-kb;
      return a.i-b.i;
    }).map(function(x){return x.co;});
    list.forEach(function(co,i){var s=co.scan||{};
      var none=String(s.verdict||'').toUpperCase()==='NONE';
      var v=svc(s.verdict);if(!none){if(v==='go')go++;else if(v==='maybe')mb++;else sk++;}
      rows+='<div class="sb-row">'
        +'<div class="sb-rank">'+(i+1)+'</div>'
        +'<div><div class="sb-nm">'+E(CAP(co.name||'',56))+' <span class="sb-dom">'+E(CAP(co.domain||'',40))+'</span></div>'+((s.why||co.summary)?'<div class="sb-why">'+E(CAP(s.why||co.summary,124))+'</div>':'')+'</div>'
        +'<div class="sb-buyer '+(none?'':(s.buyer?'go':'no'))+'">'+(none?'':(s.buyer?'✓ buyer':'– none'))+'</div>'
        +'<div class="sb-score">'+(none||s.score==null?'—':E(s.score))+'</div>'
        +'<div class="sb-vd '+(none?'':v)+'">'+(none?'':({go:'Strong',maybe:'Fair',skip:'Longshot'}[v]))+'</div>'
      +'</div>';});
    var allNone=list.every(function(c2){return String(((c2||{}).scan||{}).verdict||'').toUpperCase()==='NONE';});
    var counts=allNone?'<span class="sb-c">not ranked</span>'
      :'<span class="sb-c"><b>'+go+'</b> Strong &nbsp; <b>'+mb+'</b> Fair &nbsp; <b>'+sk+'</b> Longshot</span>';
    var noun=list.length===1?'company':'companies';
    return '<section id="pbScan"><div class="inner">'
      +'<div class="sb-h"><div class="sb-t">Company Research · '+list.length+' '+noun+'</div>'+counts+'</div>'
      +rows
      +'<div class="sb-ft"><div><b>Company research</b> · '+(allNone?'free web research':'ranked by fit · free web research')+'</div><div>'+E(PB.generated||'')+'</div></div>'
      +'</div></section>';}
  var _pw=document.getElementById('pbwrap');
  _pw.innerHTML=cos.map(brief).join('')+scanBrief(cos);
  window.crSaveAllPDF=function(){ if(_pw){_pw.classList.remove('solo');_pw.classList.add('scanmode');} window.print(); };
  window.crSavePDF=function(i){ i=i||0; if(_pw){_pw.classList.remove('scanmode');var bs=_pw.querySelectorAll('.brief');for(var k=0;k<bs.length;k++)bs[k].classList.toggle('pbactive',k===i);_pw.classList.add('solo');} window.print(); };
})();

<script id="cr-link-escape">
(function(){
  var t,timer;
  function toast(msg,url){
    if(!t){t=document.createElement('div');t.id='crLinkToast';document.body.appendChild(t);}
    t.innerHTML='';
    t.appendChild(document.createTextNode(msg));
    if(url){var s=document.createElement('span');s.className='u';s.textContent=url;t.appendChild(s);}
    t.classList.add('on');
    clearTimeout(timer);timer=setTimeout(function(){t.classList.remove('on');},4200);
  }
  function copy(url){
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){
          toast('Link copied. Paste it into your browser.',url);
        },function(){ manual(url); });
        return;
      }
    }catch(e){}
    manual(url);
  }
  function manual(url){
    var ok=false;
    try{
      var ta=document.createElement('textarea');
      ta.value=url;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:-1000px;left:-1000px;opacity:0';
      document.body.appendChild(ta);ta.select();
      ok=document.execCommand&&document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){ok=false;}
    toast(ok?'Link copied. Paste it into your browser.'
            :'This preview blocks new tabs. Copy the link:',url);
  }
  document.addEventListener('click',function(ev){
    var a=ev.target&&ev.target.closest?ev.target.closest('a[href]'):null;
    if(!a)return;
    var url=a.getAttribute('href')||'';
    if(/^\s*javascript:/i.test(url)){e.preventDefault();return;}   // never let a javascript: href run
    if(!/^https?:\/\//i.test(url))return;       // in-page and mailto: links behave normally
    ev.preventDefault();
    var w=null;
    // NOT window.open(url,'_blank','noopener'): the 'noopener' feature makes the call
    // return null BY DESIGN even when the tab opens fine, which would fire the
    // clipboard fallback on every successful click. Open without it, then sever
    // .opener by hand to get the same protection with a usable return value.
    try{ w=window.open(url,'_blank'); }catch(e){ w=null; }
    if(w){ try{w.opener=null;}catch(e){} return; }   // real tab opened, nothing else to do
    copy(url);                                       // sandboxed frame swallowed it
  },true);
})();
</script>
